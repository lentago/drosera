# ============================================================================
# Claude Code — Automated PR Review (advisory)
# ============================================================================
# Thin wrapper around lentago/shared-workflows/claude-review.yml, per
# lentago/.github ADR-0013. Copied from repo-template's reference copy; only the
# review_prompt is repo-specific.
#
# - Runs when a PR is opened or marked ready for review, and again when it is
#   labelled `re-review` (Haiku) or `review:sonnet` (Sonnet). It does NOT run on
#   every push: it shares the fleet's Claude subscription with the bullpen.
# - Advisory, never a required status check (shared-workflows ADR-0003). The
#   gate is the arming rule: don't arm until a review has posted and every
#   finding is triaged on the PR (shared-workflows CLAUDE.md, Auto-merge
#   arming). A "could not complete" soft-fail comment is not a review —
#   label `re-review`.
# - After a labelled run, `clear-label` removes the label so adding it again
#   triggers again.
# - A PR that adds or changes THIS file is not reviewed by it: the Claude Code
#   action skips unless the workflow is identical to the default branch's copy,
#   and the reusable workflow (v1.5.0+) posts a "not a review" notice instead.
#   Review such PRs locally and post the result as "Review (Haiku, local)"
#   (ADR-0013 Decision 2).
# - Dependabot PRs are skipped: Dependabot runs don't receive Actions secrets,
#   so the required token would fail the call. Review a bump locally if it
#   warrants one.
# - Drafts are skipped (by the reusable workflow) and keep their trigger label
#   until they are ready.
# ============================================================================

name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

jobs:
  review:
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 're-review' ||
       github.event.label.name == 'review:sonnet')
    # One review at a time per PR: a re-label during a running review queues
    # behind it instead of posting a duplicate.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: lentago/shared-workflows/.github/workflows/claude-review.yml@v1.5.0
    secrets: inherit
    with:
      model: ${{ github.event.label.name == 'review:sonnet' && 'sonnet' || 'haiku' }}
      review_prompt: |
        This repository is lentago/drosera, the Lentago Labs observability
        suite: Grafana Cloud dashboards, alert rules and datasources managed by
        Terraform, fed by Grafana Alloy configs (central gitops-managed Alloy on
        LXC 105, host-local Alloy on the Proxmox hosts). Merging to main
        auto-applies Terraform to the live Grafana Cloud stack. Focus your
        review on:

        - **Live-apply safety (Terraform)**: changes under `terraform/` reach
          production on merge. Check that new dashboards are added to the maps
          in `locals.tf` (and get an `imports.tf` block only if the wizard
          pre-imported them), that dashboard UIDs are never renamed (that is a
          destroy/create), that alert rules choose `no_data_state` deliberately
          for their query shape (absence rules `Alerting`, presence rules `OK`,
          probe rules `NoData`), and that plans converge (Loki instant queries
          set block-level `query_type`).
        - **Dashboard JSON**: Grafana schema v39 with no `__inputs` or
          `__requires`, bare `loki` / `prometheus` datasource UIDs (rewritten at
          apply time), a `<Group> — <What>` title prefix, and a frozen UID
          scheme (`firewalla-*`, `site-<domain>`, `<product>-<name>`). In LogQL
          inside JSON, a regex dot must be `\\\\.` in the file. Check that
          label selectors use `log_source` and don't drop data by adding a
          `cluster` matcher.
        - **Alloy config and collection model**: `alloy/` and the `deploy-alloy`
          script must stay valid `alloy fmt` syntax. A host must never be
          scraped both centrally and by its own pushing Alloy, remote_write
          stays at 60s, and new targets or labels must respect the free-tier
          active-series budget. The worker transcript shipper is not
          gitops-managed and must keep its scrubbed egress (text and tool
          names only).
        - **Secrets and public-repo hygiene**: this repo is public. Tokens
          (`alloy/ha_token`, Grafana, Axiom, alert email) must come from
          gitignored files, `/etc/default/alloy`, or sensitive no-default
          Terraform variables wired through repo secrets, never committed or
          echoed in logs. Look at workflow `permissions`, OIDC use and
          untrusted event data in `run:` lines.
        - **Scripts and small services**: shell under `scripts/`, `alloy-host/`
          and `claude-cost-export/` needs correct quoting, error handling and
          idempotency; the Python under `status-page/`, `pipeline-producer/`
          and `clients/` is stdlib-only, and a missing or failed data source
          must render as "no data", never as a healthy state.
        - **Docs and ADRs**: README rule counts, the CLAUDE.md label and
          dashboard conventions, and `docs/adr/` should match the change.
          Flag drift, and flag a decision that deserves an ADR but has none.

  clear-label:
    needs: review
    if: >-
      always() && github.event.action == 'labeled' &&
      github.event.pull_request.draft == false &&
      (github.event.label.name == 're-review' || github.event.label.name == 'review:sonnet')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the trigger label so it can be added again
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        # REST, not `gh pr edit`: the GraphQL path can trip on PR project
        # fields with GITHUB_TOKEN, and a label left behind would make the
        # next re-add a no-op (no `labeled` event).
        run: |
          enc=$(jq -rn --arg l "$LABEL" '$l|@uri')
          gh api --method DELETE "repos/$REPO/issues/$PR/labels/$enc" >/dev/null
